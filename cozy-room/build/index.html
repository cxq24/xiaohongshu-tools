<div class="footer"><span class="pill">约 12㎡ · 单人小卧室</span><span>装饰概念试玩 / 01</span></div><div id="hint" class="hint" aria-live="polite"></div></section>
<aside><h2>今天，住进哪种心情？</h2><p class="sub">挑选配色，布置你的第一个小房间</p><h3>整体风格</h3><div class="styles"><button class="style active" data-theme="matcha">抹茶奶油</button><button class="style" data-theme="peach">蜜桃午后</button><button class="style" data-theme="blue">海盐晴天</button></div><h3>墙面颜色</h3><div class="swatches" id="walls"></div><h3>床品颜色</h3><div class="swatches" id="bedding"></div><h3>地板颜色</h3><div class="swatches" id="floors"></div><h3>房间里的小美好</h3><button class="item" data-toggle="rug" aria-pressed="true"><span>▱ 柔软地毯</span><span>已摆放</span></button><button class="item" data-toggle="plant" aria-pressed="true"><span>♧ 窗边绿植</span><span>已摆放</span></button><button class="item" data-toggle="cat" aria-pressed="true"><span>♧ 午睡小猫</span><span>已摆放</span></button><button class="primary" id="export">↓ 保存我的房间图片</button><button class="reset" id="reset">恢复初始布置</button><p class="sub" style="margin-top:20px;line-height:1.8">这是装饰玩法的视觉原型。当前支持换色和显隐摆件，尚未加入家具拖动、关卡和平台登录。</p></aside></main>
<script>
const $=id=>document.getElementById(id),themes={matcha:['#e8e8cf','#f3eddd','#a9b88f','#d8bf98'],peach:['#eddbd4','#faeade','#d6a6a0','#d9bb9a'],blue:['#d6e2e0','#e8f0ea','#9cb8c9','#c9bba5']};
const groups={walls:[['#e8e8cf','抹茶'],['#eddbd4','蜜桃'],['#d6e2e0','海盐'],['#e4dfd5','燕麦']],bedding:[['#a9b88f','绿'],['#d6a6a0','粉'],['#9cb8c9','蓝'],['#d9bc82','黄']],floors:[['#d8bf98','浅木'],['#d9bb9a','暖木'],['#c9bba5','灰木'],['#b79b7c','深木']]};
function highlight(){for(const key of Object.keys(groups)){const target={walls:'wallLeft',bedding:'duvet',floors:'floor'}[key];document.querySelectorAll('#'+key+' button').forEach(b=>{const active=b.dataset.color===$(target).getAttribute('fill');b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))})}}
function clearTheme(){document.querySelectorAll('[data-theme]').forEach(b=>b.classList.remove('active'))}
for(const [key,colors]of Object.entries(groups))for(const[color,label]of colors){const b=document.createElement('button');b.className='swatch';b.style.background=color;b.dataset.color=color;b.setAttribute('aria-label',label+'配色');b.onclick=()=>{if(key==='walls'){const t=Object.values(themes).find(v=>v[0]===color);$('wallLeft').setAttribute('fill',color);$('wallRight').setAttribute('fill',t?t[1]:'#f2eee6')}else $(key==='bedding'?'duvet':'floor').setAttribute('fill',color);clearTheme();highlight()};$(key).append(b)}
function applyTheme(key){const t=themes[key];['wallLeft','wallRight','duvet','floor'].forEach((id,i)=>$(id).setAttribute('fill',t[i]));document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('active',b.dataset.theme===key));highlight()}
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>applyTheme(b.dataset.theme));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const visible=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(visible));$(b.dataset.toggle).style.display=visible?'':'none';b.lastElementChild.textContent=visible?'已摆放':'未摆放'});
const descriptions={'小床':'小床 · 今天的烦恼，睡一觉再说。','书桌':'书桌 · 给灵感留一个靠窗的位置。','绿植':'绿植 · 一点绿色，房间就有了呼吸。','地毯':'地毯 · 把赤脚踩下去的瞬间，变柔软。','小猫':'小猫 · 本房间的真正主人正在午睡。','床头柜':'床头柜 · 一盏灯，等你回家。'};document.querySelectorAll('[data-furniture]').forEach(el=>el.onclick=()=>{$('hint').textContent=descriptions[el.dataset.furniture]});
$('reset').onclick=()=>{applyTheme('matcha');document.querySelectorAll('[data-toggle]').forEach(b=>{b.setAttribute('aria-pressed','true');$(b.dataset.toggle).style.display='';b.lastElementChild.textContent='已摆放'});$('hint').textContent='已恢复抹茶奶油小卧室。'};
$('export').onclick=()=>{const svg=$('room').cloneNode(true);svg.insertAdjacentHTML('afterbegin','<rect width="800" height="650" fill="#f3f1e8"/>');const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}));const img=new Image;img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=1600;canvas.height=1300;canvas.getContext('2d').drawImage(img,0,0,1600,1300);URL.revokeObjectURL(url);canvas.toBlob(blob=>{if(!blob){$('hint').textContent='导出失败，请换用新版浏览器重试。';return}const link=document.createElement('a');const out=URL.createObjectURL(blob);link.href=out;link.download='我的小房间.png';link.click();setTimeout(()=>URL.revokeObjectURL(out),10000);$('hint').textContent='房间图片已生成，可以保存分享。'},'image/png')};img.onerror=()=>{URL.revokeObjectURL(url);$('hint').textContent='导出失败，请换用新版浏览器重试。'};img.src=url};highlight();
</script></body></html>
