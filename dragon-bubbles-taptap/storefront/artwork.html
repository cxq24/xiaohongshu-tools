<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>阿噗 · TapTap 商店物料</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172f32;color:#fff2cc;font-family:"Noto Sans CJK SC",sans-serif}img{image-rendering:pixelated}.sprite{width:var(--s);height:var(--s);overflow:hidden}.sprite img{width:calc(var(--s)*6);height:var(--s);max-width:none;display:block}
#icon{width:1024px;height:1024px;background:#c8e3d4;border:40px solid #467c65;position:relative;overflow:hidden;box-shadow:inset 0 0 0 20px #f3d68c}#icon:before{content:"";position:absolute;left:40px;right:40px;bottom:40px;height:140px;background:#8ebc91;box-shadow:0 -100px 0 #b0d2b1}#icon .sprite{--s:768px;position:absolute;left:88px;top:90px}#icon .spark{position:absolute;width:88px;height:88px;right:95px;top:90px}
#banner{width:1920px;height:1080px;position:relative;overflow:hidden;border:28px solid #f1cd7b;background:#183d3c}.landscape{position:absolute;right:0;top:0;height:100%;width:1160px;object-fit:cover;opacity:.95}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#183d3c 25%,#183d3cdd 45%,#183d3c00 80%)}.copy{position:absolute;left:110px;top:310px;width:820px}h1{font-size:102px;line-height:1.5;letter-spacing:5px;margin:0;font-weight:900;text-shadow:4px 6px #102f30}.hero{--s:620px;position:absolute;right:100px;bottom:140px;filter:drop-shadow(12px 16px 0 #42684c)}.star{position:absolute;right:95px;top:105px;width:120px}.jelly{position:absolute;right:780px;bottom:125px;width:125px}
#square{width:1440px;height:1440px;position:relative;overflow:hidden;border:28px solid #f1cd7b;background:#183d3c}#square .landscape{width:100%;height:100%;opacity:.9}#square .veil{background:linear-gradient(180deg,#183d3c 0%,#183d3c 28%,#183d3c88 52%,#183d3c22 100%)}#square .copy{left:82px;top:92px;width:1220px;text-align:center}#square h1{font-size:110px;line-height:1.35;letter-spacing:6px}#square .hero{--s:760px;right:312px;bottom:110px}#square .star{width:120px;right:105px;top:570px}#square .jelly{width:130px;right:1030px;bottom:170px}
</style>
<main id="icon"><div class="sprite"><img src="../dist/assets/dragon.png"></div><img class="spark" src="../dist/assets/star.png"></main>
<main id="banner"><img class="landscape" src="../dist/assets/w0-cover.png"><div class="veil"></div><div class="copy"><h1>阿噗的<br>糖果弹弹冒险</h1></div><div class="sprite hero"><img src="../dist/assets/dragon.png"></div><img class="star" src="../dist/assets/star.png"><img class="jelly" src="../dist/assets/jelly.png"></main>
<main id="square"><img class="landscape" src="../dist/assets/w0-cover.png"><div class="veil"></div><div class="copy"><h1>阿噗的<br>糖果弹弹冒险</h1></div><div class="sprite hero"><img src="../dist/assets/dragon.png"></div><img class="star" src="../dist/assets/star.png"><img class="jelly" src="../dist/assets/jelly.png"></main>
<script>const mode=new URLSearchParams(location.search).get('mode')||'banner';for(const el of document.querySelectorAll('main'))if(el.id!==mode)el.remove();</script>
</html>
