<body><main><header><div><b>APU'S CANDY QUEST</b><span>阿噗的糖果弹弹冒险</span></div><button id="help" aria-label="玩法说明">?</button></header><div id="game" aria-label="像素小龙弹球闯关游戏"><p id="loading">正在走进糖果森林…</p></div><footer><span>拖动瞄准 · 松手吐泡泡</span><button id="sound" aria-pressed="false">声音：关</button></footer></main>
<dialog id="help-dialog"><h2>帮阿噗救出小星星</h2><p>在战斗区域按住并拖动来瞄准，松手发射一串泡泡。也可以用方向键调整角度、空格发射。</p><ul><li>泡泡会沿墙壁反弹，撞击果冻怪。</li><li>爆米花桶会引爆周围目标，彩虹糖让泡泡暂时穿透。</li><li>击中目标积攒能量，满能量后可选择“大泡泡”。</li><li>每轮结束，敌人向下推进。越过虚线就需要重试。</li><li>“加速”缩短等待，“收球”立即结束本轮，但会放弃剩余命中。</li></ul><p>共六关，后五关逐关解锁。通过关卡会保存进度；当前关内的战斗不保存。声音默认关闭。</p><button id="close-help">明白了</button></dialog><script defer src="ui.js"></script></body></html>
